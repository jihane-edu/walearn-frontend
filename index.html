<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WaLearn Manager — Express</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4 font-sans">

    <div class="w-full max-w-md bg-white rounded-2xl border border-slate-200 shadow-xl p-6 space-y-6">
        <div class="text-center space-y-2">
            <div class="text-4xl">⚡</div>
            <h1 class="text-2xl font-bold text-slate-800">WaLearn Quick Manager</h1>
            <p class="text-sm text-slate-500">Connectez votre WhatsApp instantanément</p>
        </div>

        <div class="p-3 bg-blue-50 border border-blue-200 rounded-xl flex items-center justify-between text-xs font-medium text-blue-800">
            <span class="flex items-center gap-1.5">
                <span class="h-2 w-2 rounded-full bg-blue-500 animate-pulse"></span>
                Serveur Cloud WhatsApp Express
            </span>
            <span class="bg-blue-100 px-2 py-0.5 rounded-md text-blue-700">🟢 Cloud Actif</span>
        </div>

        <div class="space-y-4">
            <label class="block text-sm font-semibold text-slate-700">Numéro de téléphone</label>
            <input id="phoneInput" type="text" placeholder="212679119068" 
                   class="w-full h-11 px-3 rounded-xl border border-slate-200 outline-none focus:ring-2 focus:ring-blue-400 text-lg transition-all">
            
            <button onclick="getPairingCodeExpress()" id="submitBtn"
                    class="w-full h-11 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl shadow-md transition-colors flex items-center justify-center gap-2 text-sm">
                Générer le Code instantanément
            </button>
        </div>

        <div id="resultBox" class="hidden p-5 rounded-xl bg-green-50 border border-green-200 text-center space-y-2">
            <p class="text-xs text-green-700 font-semibold">✅ Code généré avec succès !</p>
            <div id="codeDisplay" class="text-4xl font-mono font-bold tracking-[0.3em] text-green-800 py-2"></div>
            <p class="text-xs text-slate-500">Ouvrez WhatsApp → <strong>Appareils liés → Lier avec numéro</strong></p>
        </div>
    </div>

    <script>
        async function getPairingCodeExpress() {
            const phone = document.getElementById('phoneInput').value.replace(/[\s\-\+\(\)]/g, '');
            const btn = document.getElementById('submitBtn');
            const resultBox = document.getElementById('resultBox');
            const codeDisplay = document.getElementById('codeDisplay');

            if (!phone || phone.length < 8) {
                alert('Veuillez entrer un numéro valide.'); return;
            }

            btn.disabled = true;
            btn.innerText = 'Connexion au Cloud...';

            try {
                // هاد الرابط كيمشي لواحد السيرفر واجد وعالمي د الواتساب كيعطي الكود ف ثانية!
                const res = await fetch(`https://api.whatsapp4all.workers.dev/pairing?phone=${phone}`);
                const data = await res.json();
                
                if (data.code) {
                    codeDisplay.innerText = data.code;
                    resultBox.classList.remove('hidden');
                } else {
                    alert('Le serveur Cloud est surchargé, réessayez dans un instant.');
                }
            } catch (err) {
                alert('Erreur de connexion au Cloud.');
            } finally {
                btn.disabled = false;
                btn.innerText = 'Générer le Code instantanément';
            }
        }
    </script>
</body>
</html>
